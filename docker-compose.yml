  #     - ./models:/models
  #   command: >
  #     --model /models/Qwen2.5-7B-Instruct
  #     --served-model-name Qwen2.5-7B-Instruct
  #     --max-model-len 32768
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   networks:
  #     - knowledge-net

networks:
  knowledge-net:
    driver: bridge
